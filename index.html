<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FF6B9D">
  <title>Super Gaelle!</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: 'Comic Sans MS', cursive, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
    #game { width: 100%; height: 100%; position: relative; overflow: hidden; }
  </style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const G = 0.6, JF = -11, FF = -7, MJ = 4, SS = 3, SI = 100, SSP = 65, DUR = 60;
const OBS = ["👻","🐉","👾","🦇","💀","🎃","👹","🐲"];
const COL = ["⭐","🌟","💎","🦋","🍭","🌈"];
const BE = ["✨","🎉","💫","🌟","❤️","🎊","🥳","💖"];
const BGC = [
  "linear-gradient(180deg, #87CEEB 0%, #98FB98 100%)",
  "linear-gradient(180deg, #FFB6C1 0%, #FFECD2 100%)",
  "linear-gradient(180deg, #DDA0DD 0%, #F0E68C 100%)",
  "linear-gradient(180deg, #89CFF0 0%, #FFC0CB 100%)",
];
const FM = [
  "You're a SUPERSTAR, Gaelle! 🌟","Amazing jumping, Gaelle! 🦘",
  "You're the BEST! 💖","WOW, incredible! 🎉",
  "Super duper, Gaelle! 🌈","You did it! 🥳",
  "Champion jumper! 🏆","So awesome, Gaelle! ✨",
];

// Storage helpers using localStorage
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set: (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} },
};

function Burst({x,y}) {
  const [ps] = useState(()=>Array.from({length:8},(_,i)=>({id:i,e:BE[Math.floor(Math.random()*BE.length)],a:(i/8)*Math.PI*2,s:2+Math.random()*3})));
  const [f,sF] = useState(0);
  useEffect(()=>{let id;const tick=()=>{sF(v=>v+1);id=requestAnimationFrame(tick);};id=requestAnimationFrame(tick);return()=>cancelAnimationFrame(id);},[]);
  if(f>20) return null;
  return <>{ps.map(p=>{const px=x+Math.cos(p.a)*p.s*f,py=y+Math.sin(p.a)*p.s*f-f*0.5;return <div key={p.id} style={{position:"absolute",transform:`translate3d(${px}px,${py}px,0) rotate(${f*10}deg)`,fontSize:18,opacity:1-f/20,pointerEvents:"none",willChange:"transform,opacity"}}>{p.e}</div>})}</>;
}

function HitBurst({x,y}) {
  const [f,sF] = useState(0);
  useEffect(()=>{let id;const tick=()=>{sF(v=>v+1);id=requestAnimationFrame(tick);};id=requestAnimationFrame(tick);return()=>cancelAnimationFrame(id);},[]);
  if(f>15) return null;
  return <div style={{position:"absolute",transform:`translate3d(${x-20}px,${y-20}px,0) scale(${1+f*0.15})`,fontSize:40,opacity:1-f/15,pointerEvents:"none",willChange:"transform,opacity"}}>💥</div>;
}

function Face({size,photo,fs}) {
  return <div style={{width:size,height:size,borderRadius:"50%",background:"#FFE4B5",border:`${size>60?4:3}px solid #FF6B9D`,overflow:"hidden",margin:"0 auto",boxShadow:"0 3px 10px rgba(0,0,0,0.15)",position:"relative",zIndex:3}}>
    {photo ? <img src={photo} alt="Gaelle" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:"50%"}} /> : <span style={{fontSize:fs,display:"flex",alignItems:"center",justifyContent:"center",height:"100%"}}>😊</span>}
  </div>;
}

function Char({y,frame:f,onGround:og,wobble:w,wobbleFrame:wf,photo}) {
  const lA=og?Math.sin(f*0.3)*20:-15, aA=og?Math.sin(f*0.3+1)*25:-30;
  const wR=w?Math.sin(wf*0.8)*25:0, wS=w?1+Math.sin(wf*1.2)*0.1:1, wC=w?`hue-rotate(${wf*20}deg)`:"none";
  return <div style={{position:"absolute",transform:`translate3d(55px,${y-25+80}px,0) rotate(${wR}deg) scale(${wS})`,width:70,height:110,filter:wC,transition:w?"none":"transform 0.1s",willChange:"transform"}}>
    <Face size={50} photo={photo} fs={28} />
    <div style={{width:40,height:36,background:"linear-gradient(180deg,#FF6B9D,#FF8E53)",borderRadius:"12px 12px 8px 8px",margin:"-6px auto 0",position:"relative",zIndex:2,boxShadow:"0 2px 6px rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:14,marginTop:2}}>⭐</span></div>
    <div style={{position:"absolute",left:2,top:52,width:16,height:7,background:"#FFB347",borderRadius:5,transformOrigin:"right center",transform:`rotate(${aA}deg)`,zIndex:1}} />
    <div style={{position:"absolute",right:2,top:52,width:16,height:7,background:"#FFB347",borderRadius:5,transformOrigin:"left center",transform:`rotate(${-aA}deg)`,zIndex:1}} />
    <div style={{position:"absolute",bottom:0,left:18,width:10,height:20,background:"#4A90D9",borderRadius:"4px 4px 6px 6px",transformOrigin:"top center",transform:`rotate(${lA}deg)`,zIndex:1}}><div style={{position:"absolute",bottom:-3,left:-2,width:14,height:7,background:"#E74C3C",borderRadius:"3px 6px 4px 3px"}} /></div>
    <div style={{position:"absolute",bottom:0,right:18,width:10,height:20,background:"#4A90D9",borderRadius:"4px 4px 6px 6px",transformOrigin:"top center",transform:`rotate(${-lA}deg)`,zIndex:1}}><div style={{position:"absolute",bottom:-3,right:-2,width:14,height:7,background:"#E74C3C",borderRadius:"6px 3px 3px 4px"}} /></div>
  </div>;
}

function StartChar({photo}) {
  const [f,sF] = useState(0);
  useEffect(()=>{let id;const tick=()=>{sF(v=>v+1);id=requestAnimationFrame(tick);};id=requestAnimationFrame(tick);return()=>cancelAnimationFrame(id);},[]);
  const b=Math.sin(f*0.15)*8, lA=Math.sin(f*0.2)*15, aA=Math.sin(f*0.2+1)*20;
  return <div style={{width:100,height:160,position:"relative",transform:`translateY(${b}px)`,margin:"0 auto 16px"}}>
    <Face size={72} photo={photo} fs={40} />
    <div style={{width:56,height:48,background:"linear-gradient(180deg,#FF6B9D,#FF8E53)",borderRadius:"14px 14px 10px 10px",margin:"-8px auto 0",position:"relative",zIndex:2,boxShadow:"0 3px 8px rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:20}}>⭐</span></div>
    <div style={{position:"absolute",left:4,top:76,width:22,height:9,background:"#FFB347",borderRadius:6,transformOrigin:"right center",transform:`rotate(${aA}deg)`,zIndex:1}} />
    <div style={{position:"absolute",right:4,top:76,width:22,height:9,background:"#FFB347",borderRadius:6,transformOrigin:"left center",transform:`rotate(${-aA}deg)`,zIndex:1}} />
    <div style={{position:"absolute",bottom:10,left:28,width:14,height:28,background:"#4A90D9",borderRadius:"5px 5px 7px 7px",transformOrigin:"top center",transform:`rotate(${lA}deg)`,zIndex:1}}><div style={{position:"absolute",bottom:-4,left:-3,width:18,height:9,background:"#E74C3C",borderRadius:"3px 7px 5px 3px"}} /></div>
    <div style={{position:"absolute",bottom:10,right:28,width:14,height:28,background:"#4A90D9",borderRadius:"5px 5px 7px 7px",transformOrigin:"top center",transform:`rotate(${-lA}deg)`,zIndex:1}}><div style={{position:"absolute",bottom:-4,right:-3,width:18,height:9,background:"#E74C3C",borderRadius:"7px 3px 3px 5px"}} /></div>
  </div>;
}

function Setup({onDone}) {
  const fr = useRef(null);
  const [ld,sL] = useState(false);
  const hf = (e) => {
    const file = e.target.files?.[0]; if(!file) return; sL(true);
    const r = new FileReader();
    r.onload = (ev) => { const d = ev.target.result; store.set("superme-photo", d); onDone(d); };
    r.readAsDataURL(file);
  };
  return <div style={{width:"100%",height:"100%",background:BGC[0],display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Comic Sans MS',cursive,sans-serif"}}>
    <div style={{fontSize:60,marginBottom:12}}>🌈📸</div>
    <h1 style={{fontSize:28,color:"#FF6B9D",textShadow:"2px 2px 0 #fff",margin:"0 0 8px 0",textAlign:"center"}}>Welcome to Super Gaelle!</h1>
    <p style={{fontSize:15,color:"#666",margin:"0 0 24px 0",textAlign:"center",padding:"0 30px",lineHeight:1.5}}>Let's set up the game!<br/>Pick a photo of Gaelle to make her the star ⭐</p>
    <div onClick={()=>fr.current?.click()} style={{width:130,height:130,borderRadius:"50%",background:"#FFE4B5",border:"4px dashed #FF6B9D",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",marginBottom:20,boxShadow:"0 4px 15px rgba(255,107,157,0.2)"}}>
      {ld ? <span style={{fontSize:16,color:"#FF6B9D"}}>Loading...</span> : <div style={{textAlign:"center"}}><div style={{fontSize:44}}>📸</div><div style={{fontSize:12,color:"#999",marginTop:4}}>Tap to add photo</div></div>}
    </div>
    <input ref={fr} type="file" accept="image/*" onChange={hf} style={{display:"none"}} />
    <button onClick={()=>onDone(null)} style={{background:"none",border:"none",color:"#bbb",fontSize:13,cursor:"pointer",marginTop:8}}>Skip for now</button>
  </div>;
}

function Game() {
  const [rdy,sR] = useState(false);
  const [photo,sP] = useState(null);
  const [scr,sSc] = useState("start");
  const [score,sSco] = useState(0);
  const [tl,sTl] = useState(DUR);
  const [hs,sHs] = useState(0);
  const [bursts,sB] = useState([]);
  const [hb,sHb] = useState([]);
  const [wob,sW] = useState(false);
  const [wf,sWf] = useState(0);
  const [nr,sNr] = useState(false);
  const [fm,sFm] = useState("");
  const [,sT] = useState(0);

  const W = window.innerWidth, H = window.innerHeight, cX = 80;
  const GY = Math.floor(H * 0.7) - 168;

  const raf = useRef(null), tmr = useRef(null), fr = useRef(null);
  const st = useRef({
    y:GY,vy:0,og:true,jc:0,obs:[],stars:[],f:0,sc:0,bi:0,wt:0,nob:60+Math.floor(Math.random()*100),
    cl:Array.from({length:5},(_,i)=>({x:i*160+Math.random()*80,y:30+Math.random()*80,sz:30+Math.random()*30,sp:0.3+Math.random()*0.5})),
    hl:[{x:0,w:200,h:80,c:"#90EE90"},{x:180,w:150,h:60,c:"#98FB98"},{x:350,w:250,h:90,c:"#7CFC00"},{x:550,w:180,h:70,c:"#90EE90"}],
  });

  useEffect(()=>{
    const p = store.get("superme-photo"); if(p) sP(p);
    const h = store.get("superme-highscore"); if(h) sHs(parseInt(h,10)||0);
    sR(true);
  },[]);

  const saveHs = (v) => store.set("superme-highscore", String(v));

  const hPC = (e) => {
    const file = e.target.files?.[0]; if(!file) return;
    const r = new FileReader();
    r.onload = (ev) => { const d = ev.target.result; sP(d); store.set("superme-photo", d); };
    r.readAsDataURL(file);
  };

  const jump = useCallback(()=>{
    if(scr!=="play") return;
    const s = st.current, near = s.y >= GY - 5;
    if(s.og||near) { s.y=Math.min(s.y,GY); s.vy=JF; s.og=false; s.jc=1; }
    else if(s.jc<MJ) { s.vy=FF; s.jc++; }
  },[scr]);

  const endG = useCallback((fs)=>{
    if(raf.current) cancelAnimationFrame(raf.current);
    if(tmr.current) clearInterval(tmr.current);
    sFm(FM[Math.floor(Math.random()*FM.length)]);
    if(fs>hs) { sHs(fs); sNr(true); saveHs(fs); } else sNr(false);
    sSc("gameover");
  },[hs]);

  const startG = ()=>{
    const s=st.current; s.y=GY;s.vy=0;s.og=true;s.jc=0;s.obs=[];s.stars=[];s.f=0;s.sc=0;s.wt=0;s.nob=60+Math.floor(Math.random()*100);
    sSco(0);sTl(DUR);sB([]);sHb([]);sW(false);sWf(0);sNr(false);sSc("play");
  };

  useEffect(()=>{
    if(scr!=="play") return;
    sTl(DUR);
    tmr.current = setInterval(()=>{ sTl(p=>{ if(p<=1){endG(st.current.sc);return 0;} return p-1; }); },1000);
    return ()=>{ if(tmr.current) clearInterval(tmr.current); };
  },[scr,endG]);

  useEffect(()=>{
    if(scr!=="play") { if(raf.current) cancelAnimationFrame(raf.current); return; }
    const loop = ()=>{
      const s=st.current; s.f++;
      if(s.wt>0){s.wt--;if(s.wt<=0)sW(false);}
      s.vy+=G; s.y+=s.vy;
      if(s.y>=GY){s.y=GY;s.vy=0;s.og=true;s.jc=0;}
      if(s.f>=s.nob){s.nob=s.f+60+Math.floor(Math.random()*100);s.obs.push({x:W+20,e:OBS[Math.floor(Math.random()*OBS.length)],id:Math.random(),bo:Math.random()*Math.PI*2});}
      if(s.f%SSP===0) s.stars.push({x:W+20,y:GY-50-Math.random()*100,e:COL[Math.floor(Math.random()*COL.length)],id:Math.random()});
      s.obs=s.obs.map(o=>({...o,x:o.x-SS})).filter(o=>o.x>-60);
      s.stars=s.stars.map(o=>({...o,x:o.x-SS})).filter(o=>o.x>-50);
      s.cl=s.cl.map(c=>({...c,x:c.x-c.sp,...(c.x<-60?{x:W+20,y:30+Math.random()*80}:{})}));
      s.hl=s.hl.map(h=>({...h,x:h.x-SS*0.3,...(h.x<-h.w?{x:W+Math.random()*100,w:150+Math.random()*100,h:50+Math.random()*50}:{})}));
      if(s.f%600===0) s.bi=(s.bi+1)%BGC.length;
      const cx=cX+10, cb=s.y+50;
      for(let i=s.obs.length-1;i>=0;i--){
        const o=s.obs[i],oc=o.x+20,ot=GY+20;
        if(Math.abs(cx-oc)<30&&cb>ot-10){
          s.obs.splice(i,1);s.sc=Math.max(0,s.sc-1);s.wt=25;
          sW(true);sWf(0);sSco(s.sc);
          sHb(p=>[...p.slice(-3),{id:Math.random(),x:oc,y:ot+60}]);
        }
      }
      for(let i=s.stars.length-1;i>=0;i--){
        const o=s.stars[i];
        if(Math.abs(cx-o.x)<35&&Math.abs(s.y+10-o.y)<40){
          s.sc++;sB(p=>[...p.slice(-5),{id:Math.random(),x:o.x,y:o.y}]);
          s.stars.splice(i,1);sSco(s.sc);
        }
      }
      sT(t=>t+1); if(wob) sWf(f=>f+1);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return ()=>{ if(raf.current) cancelAnimationFrame(raf.current); };
  },[scr,wob]);

  const s = st.current;
  const tCol = tl<=10?"#E74C3C":tl<=20?"#F39C12":"#FF6B9D";
  const fnt = "'Comic Sans MS',cursive,sans-serif";

  if(!rdy) return <div style={{width:"100%",height:"100%",background:BGC[0],display:"flex",alignItems:"center",justifyContent:"center",fontFamily:fnt}}>
    <div style={{textAlign:"center"}}><div style={{fontSize:48,marginBottom:12}}>🌈</div><div style={{fontSize:18,color:"#FF6B9D"}}>Loading...</div></div>
  </div>;

  if(rdy && !photo && scr==="start") return <Setup onDone={(d)=>{sP(d);sSc("start");}} />;

  if(scr==="start") return <div style={{width:"100%",height:"100%",background:BGC[0],display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:fnt,position:"relative",overflow:"hidden"}}>
    <div style={{fontSize:48,marginBottom:4}}>🌈</div>
    <h1 style={{fontSize:32,color:"#FF6B9D",textShadow:"2px 2px 0 #fff",margin:"0 0 4px 0",textAlign:"center"}}>Super Gaelle!</h1>
    <p style={{fontSize:16,color:"#666",margin:"0 0 16px 0"}}>Jump Adventure ⭐</p>
    <StartChar photo={photo} />
    {hs>0 && <div style={{background:"rgba(255,255,255,0.7)",borderRadius:16,padding:"6px 20px",marginBottom:12,fontSize:16,color:"#FF6B9D",fontWeight:"bold"}}>🏆 High Score: {hs}</div>}
    <button onClick={startG} style={{background:"linear-gradient(135deg,#FF6B9D,#FF8E53)",border:"none",borderRadius:30,padding:"16px 48px",fontSize:24,color:"#fff",cursor:"pointer",fontFamily:fnt,fontWeight:"bold",boxShadow:"0 4px 15px rgba(255,107,157,0.4)"}}>▶ PLAY!</button>
    <p style={{fontSize:12,color:"#aaa",marginTop:10}}>60 seconds · Tap anywhere to jump!</p>
    <button onClick={()=>fr.current?.click()} style={{background:"none",border:"none",color:"#ccc",fontSize:11,cursor:"pointer",marginTop:8}}>📷 Change photo</button>
    <input ref={fr} type="file" accept="image/*" onChange={hPC} style={{display:"none"}} />
  </div>;

  if(scr==="gameover") return <div style={{width:"100%",height:"100%",background:"linear-gradient(180deg,#FFB6C1 0%,#FFECD2 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:fnt,position:"relative",overflow:"hidden"}}>
    {["🌟","⭐","✨","💖","🎉","🌈","🦋","🍭"].map((e,i)=><div key={i} style={{position:"absolute",left:`${10+i*12}%`,top:`${15+(i%3)*25}%`,fontSize:28+i*2,opacity:0.3,transform:`rotate(${i*30}deg)`}}>{e}</div>)}
    <div style={{fontSize:56,marginBottom:8}}>🎊</div>
    <h1 style={{fontSize:28,color:"#FF6B9D",textShadow:"2px 2px 0 #fff",margin:"0 0 4px 0"}}>Time's Up!</h1>
    <p style={{fontSize:20,color:"#666",margin:"8px 0 20px 0",textAlign:"center",padding:"0 20px"}}>{fm}</p>
    <div style={{background:"rgba(255,255,255,0.8)",borderRadius:20,padding:"20px 40px",textAlign:"center",marginBottom:16,boxShadow:"0 4px 15px rgba(0,0,0,0.1)"}}>
      <div style={{fontSize:16,color:"#999",marginBottom:4}}>Gaelle's Score</div>
      <div style={{fontSize:48,fontWeight:"bold",color:"#FF6B9D"}}>⭐ {score}</div>
      {nr && <div style={{marginTop:8,fontSize:18,color:"#F39C12",fontWeight:"bold",animation:"pulse 0.8s ease-in-out infinite"}}>🏆 NEW HIGH SCORE! 🏆</div>}
      {!nr && hs>0 && <div style={{marginTop:8,fontSize:14,color:"#999"}}>🏆 Best: {hs}</div>}
    </div>
    <button onClick={startG} style={{background:"linear-gradient(135deg,#FF6B9D,#FF8E53)",border:"none",borderRadius:30,padding:"16px 48px",fontSize:24,color:"#fff",cursor:"pointer",fontFamily:fnt,fontWeight:"bold",boxShadow:"0 4px 15px rgba(255,107,157,0.4)",marginTop:8}}>🔄 Play Again!</button>
    <button onClick={()=>sSc("start")} style={{background:"none",border:"none",color:"#999",fontSize:14,cursor:"pointer",marginTop:12}}>← Back to Start</button>
    <style>{`@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.1)}}`}</style>
  </div>;

  // PLAY
  return <div onClick={jump} onTouchStart={(e)=>{e.preventDefault();jump();}} style={{width:"100%",height:"100%",background:BGC[s.bi],position:"relative",overflow:"hidden",cursor:"pointer"}}>
    <div style={{position:"absolute",top:12,left:0,right:0,textAlign:"center",fontSize:24,fontWeight:"bold",color:tCol,zIndex:10,textShadow:"1px 1px 0 #fff",transform:tl<=10?`scale(${1+Math.sin(Date.now()*0.01)*0.08})`:"none"}}>⏱ {tl}s</div>
    <div style={{position:"absolute",top:12,right:16,fontSize:24,color:"#FF6B9D",fontWeight:"bold",zIndex:10,textShadow:"1px 1px 0 #fff"}}>⭐ {score}</div>
    <button onClick={e=>{e.stopPropagation();if(tmr.current)clearInterval(tmr.current);sSc("start");}} style={{position:"absolute",top:12,left:12,background:"rgba(255,255,255,0.7)",border:"none",borderRadius:20,padding:"6px 14px",fontSize:14,cursor:"pointer",zIndex:10}}>← Back</button>

    {s.cl.map((c,i)=><div key={i} style={{position:"absolute",transform:`translate3d(${c.x}px,${c.y}px,0)`,fontSize:c.sz,opacity:0.6,pointerEvents:"none",willChange:"transform"}}>☁️</div>)}
    {s.hl.map((h,i)=><div key={i} style={{position:"absolute",bottom:0,transform:`translate3d(${h.x}px,0,0)`,width:h.w,height:h.h,borderRadius:"50% 50% 0 0",background:h.c,pointerEvents:"none",willChange:"transform"}} />)}
    <div style={{position:"absolute",bottom:0,left:0,right:0,height:"30%",background:"linear-gradient(180deg,#7CFC00,#228B22)",borderTop:"3px solid #32CD32"}}>
      {Array.from({length:20},(_,i)=><span key={i} style={{position:"absolute",top:-8,transform:`translate3d(${((i*73+s.f*SS*0.5)%(W+40))-20}px,0,0)`,fontSize:14,opacity:0.6,willChange:"transform"}}>🌿</span>)}
    </div>

    {s.obs.map(o=>{const bob=Math.sin(s.f*0.08+o.bo)*6;return <div key={o.id} style={{position:"absolute",transform:`translate3d(${o.x}px,${GY+15+80+bob}px,0) scaleX(${s.f%60<30?1:-1})`,fontSize:42,filter:"drop-shadow(0 2px 4px rgba(0,0,0,0.3))",transition:"transform 0.3s",willChange:"transform"}}>{o.e}</div>;})}
    {s.stars.map(o=><div key={o.id} style={{position:"absolute",transform:`translate3d(${o.x}px,${o.y+80}px,0) rotate(${Math.sin(s.f*0.1)*15}deg) scale(${1+Math.sin(s.f*0.15)*0.15})`,fontSize:28,willChange:"transform"}}>{o.e}</div>)}

    <Char y={s.y} frame={s.f} onGround={s.og} wobble={wob} wobbleFrame={wf} photo={photo} />
    {bursts.map(b=><Burst key={b.id} x={b.x} y={b.y+80} />)}
    {hb.map(b=><HitBurst key={b.id} x={b.x} y={b.y} />)}
    {wob && <div style={{position:"absolute",top:"45%",left:0,right:0,textAlign:"center",fontSize:32,fontWeight:"bold",color:"#E74C3C",textShadow:"0 2px 8px rgba(0,0,0,0.2)",opacity:0.8,pointerEvents:"none"}}>-1 💥</div>}
    {s.f<120 && <div style={{position:"absolute",bottom:30,left:0,right:0,textAlign:"center",fontSize:18,color:"rgba(255,107,157,0.8)",fontWeight:"bold"}}><span style={{animation:"pulse 1s ease-in-out infinite",display:"inline-block"}}>👆 Tap anywhere to jump!</span></div>}
    <style>{`@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.95)}}`}</style>
  </div>;
}

ReactDOM.createRoot(document.getElementById("game")).render(<Game />);
</script>

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
